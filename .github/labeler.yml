"area: data":
  - changed-files:
      - any-glob-to-any-file:
          - data/**
          - lib/**
          - native.ts

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - components/**
          - styles.css
          - assets/**
          - settings.tsx
          - index.tsx

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
