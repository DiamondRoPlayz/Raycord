name: Stale

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Close inactive issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,confirmed,vencord-compat
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 45 days. It will close in two weeks
            unless someone adds new information or confirms it still happens on the latest release.
          stale-pr-message: >
            This pull request has had no activity for 45 days. It will close in two weeks
            unless it gets an update.
          close-issue-reason: not_planned
